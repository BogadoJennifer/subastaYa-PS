plugins {
    id 'base'
}

tasks.named('build') {
    dependsOn(':backend:build')
}

tasks.named('check') {
    dependsOn(':backend:check')
}

tasks.named('clean') {
    dependsOn(':backend:clean')
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs the backend test suite.'
    dependsOn(':backend:test')
}

tasks.register('bootRun') {
    group = 'application'
    description = 'Starts the backend application.'
    dependsOn(':backend:bootRun')
}
